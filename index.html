<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0d12">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 10 10%22><path fill=%22%237d5cff%22 d=%22M6 0 2 6h3l-1 4 4-6H5z%22/></svg>">
  <title>SF Downloader</title>
  <style>
    html,body,#root{width:100%;height:100%;margin:0;padding:0;background:transparent!important;overflow:hidden}
    .boot-loader{
      position:fixed;inset:0;width:100%;height:100%;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:14px;
      color:#94a3b8;font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background:radial-gradient(circle at 50% 40%,#1a1e29 0%,#0b0d12 70%);
      border-radius:12px;overflow:hidden;user-select:none;
    }
    .sf-splash-cup-wrap{position:relative;display:grid;place-items:center;filter:drop-shadow(0 10px 24px rgba(0,0,0,0.5))}
    .sf-splash-steam .sf-steam-1{animation:sf-steam-drift 2.2s cubic-bezier(0.4,0,0.2,1) infinite;transform-origin:bottom center}
    .sf-splash-steam .sf-steam-2{animation:sf-steam-drift 2.2s cubic-bezier(0.4,0,0.2,1) infinite .6s;transform-origin:bottom center}
    @keyframes sf-steam-drift{0%{opacity:0;transform:translateY(6px) scaleX(0.9)}40%{opacity:0.55}80%{opacity:0.2;transform:translateY(-8px) scaleX(1.15)}100%{opacity:0;transform:translateY(-14px) scaleX(1.3)}}
    .sf-splash-arrow{filter:drop-shadow(0 2px 5px rgba(245,158,11,0.45));animation:sf-arrow-subtle-bounce 2s ease-in-out infinite}
    @keyframes sf-arrow-subtle-bounce{0%,100%{transform:translate(76px,85px)}50%{transform:translate(76px,87px)}}
    .sf-splash-text{font-size:13.5px;font-weight:500;letter-spacing:.6px;color:#94a3b8;margin:0}
    .sf-splash-dots{display:flex;align-items:center;gap:8px}
    .sf-splash-dot{width:6px;height:6px;border-radius:50%;background:#334155;transition:all .3s ease}
    .sf-dot-1{animation:sf-dot-glow 1.2s ease-in-out infinite 0s}
    .sf-dot-2{animation:sf-dot-glow 1.2s ease-in-out infinite .25s}
    .sf-dot-3{animation:sf-dot-glow 1.2s ease-in-out infinite .5s}
    @keyframes sf-dot-glow{0%,100%{background:#334155;transform:scale(1);box-shadow:none}40%{background:#f59e0b;transform:scale(1.25);box-shadow:0 0 8px rgba(245,158,11,.7)}}
  </style>
</head>
<body>
  <div id="root">
    <div class="boot-loader">
      <div class="sf-splash-cup-wrap">
        <svg class="sf-splash-cup-svg" viewBox="0 0 160 140" width="130" height="114" fill="none" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="76" cy="128" rx="46" ry="7" fill="#000000" fillOpacity="0.45" />
          <g class="sf-splash-steam">
            <path class="sf-steam-1" d="M68 40 C64 32, 74 24, 70 14 C67 7, 72 3, 73 0" stroke="#94a3b8" strokeWidth="2.5" strokeLinecap="round" fill="none" opacity="0.4" />
            <path class="sf-steam-2" d="M84 40 C80 30, 90 22, 86 12 C83 5, 88 2, 89 0" stroke="#94a3b8" strokeWidth="2.5" strokeLinecap="round" fill="none" opacity="0.4" />
          </g>
          <path d="M112 55 C132 55, 136 92, 114 97" stroke="#5b6b84" strokeWidth="7" strokeLinecap="round" fill="none" />
          <path d="M112 55 C132 55, 136 92, 114 97" stroke="#34435a" strokeWidth="4" strokeLinecap="round" fill="none" />
          <path d="M34 48 C34 98, 52 120, 76 120 C100 120, 118 98, 118 48 Z" fill="#273449" stroke="#7c8ba5" strokeWidth="2" />
          <ellipse cx="76" cy="48" rx="42" ry="12" fill="#111827" stroke="#94a3b8" strokeWidth="2" />
          <ellipse cx="76" cy="53" rx="36" ry="9" fill="#f59e0b" />
          <g class="sf-splash-arrow" transform="translate(76, 85)">
            <line x1="0" y1="-14" x2="0" y2="4" stroke="#f59e0b" strokeWidth="2.8" strokeLinecap="round" />
            <polyline points="-6,-1 0,5 6,-1" stroke="#f59e0b" strokeWidth="2.8" strokeLinecap="round" strokeLinejoin="round" fill="none" />
            <line x1="-9" y1="11" x2="9" y2="11" stroke="#f59e0b" strokeWidth="2.8" strokeLinecap="round" />
          </g>
        </svg>
      </div>
      <p class="sf-splash-text">Carregando...</p>
      <div class="sf-splash-dots">
        <span class="sf-splash-dot sf-dot-1"></span>
        <span class="sf-splash-dot sf-dot-2"></span>
        <span class="sf-splash-dot sf-dot-3"></span>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
