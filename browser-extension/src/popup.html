<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="popup.css">
  <title>SF Downloader</title>
</head>
<body>
  <header class="popup-header">
    <div class="header-left">
      <img src="icons/sf-small.png" alt="SF Downloader" class="app-logo">
      <div class="header-titles">
        <div class="title-row">
          <strong>SF Downloader</strong>
          <span id="version-badge" class="version-badge">v0.3.5</span>
        </div>
      </div>
    </div>
    <div class="header-right">
      <i id="connection" class="connection-dot" title="Verificando conexão..."></i>
    </div>
  </header>

  <main class="popup-main">
    <!-- Card Principal: Ativar/Desativar Captura -->
    <div class="setting-card">
      <div class="setting-info">
        <strong id="auto-capture-title">Captura automática</strong>
        <span id="auto-capture-desc">Intercepta downloads do navegador</span>
      </div>
      <button id="capture" role="switch" aria-checked="false" aria-label="Ativar captura automática">
        <i class="switch-thumb"></i>
      </button>
    </div>

    <!-- Extensões Ignoradas -->
    <section class="exclusion-section">
      <div class="exclusion-header">
        <strong id="ignored-exts-title">Extensões ignoradas</strong>
        <button type="button" id="btn-reset-default" class="reset-link">Restaurar padrão</button>
      </div>
      <textarea id="disabled-extensions-input" class="exclusion-input" rows="2" spellcheck="false" placeholder="Ex: JPG PNG GIF TXT"></textarea>
      <span id="exclusion-hint" class="exclusion-hint">Separar por espaço. Esses formatos serão baixados pelo navegador.</span>
    </section>

    <!-- Footer de Status de Conexão -->
    <footer class="status-footer">
      <span id="status" class="status-text">Verificando conexão...</span>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
